name: CI

on:
  push:
    branches:
      - "main"
      - "dev"
      
  pull_request:
    branches:
      - "main"
      - "dev"
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-pip \
            nasm \
            iasl \
            uuid-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            libgtk-3-dev \
            ninja-build \
            flex \
            bison \
            llvm-dev \
            libjemalloc-dev \
            glslc \
            pkg-config \
            wget

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          clean: true 

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Apply Patches
        run: ./scripts/apply_patches.sh

      - name: Build All
        run: ./scripts/build_all.sh RELEASE

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    defaults:
      run:
        shell: bash

    steps:
      - name: Run Tests
        run: echo "stub"
